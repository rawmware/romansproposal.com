<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northline Finds — Cheap Finds, Free US Shipping</title>
  <meta name="description" content="Cheap, useful finds with free US shipping. New lineup every day. Tap, buy, done." />
  <link rel="canonical" href="https://www.romansproposal.com/" />
  <meta property="og:title" content="Northline Finds — Cheap Finds, Free US Shipping" />
  <meta property="og:description" content="New cheap finds every day. Tap, buy, done." />
  <meta property="og:url" content="https://www.romansproposal.com/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
      --accent: #0ea5e9; --buy: #16a34a; --buy-hover: #15803d; --bar: #0f172a; --bar-ink: #f8fafc; --warn: #facc15;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1120; --card: #111827; --ink: #f1f5f9; --muted: #94a3b8; --line: #1f2937; --bar: #020617; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: inherit; }
    .bar { position: sticky; top: 0; z-index: 10; background: var(--bar); color: var(--bar-ink); text-align: center; padding: 9px 16px; font-size: 14px; font-weight: 600; }
    .bar .t { color: var(--warn); font-variant-numeric: tabular-nums; }
    header { max-width: 1120px; margin: 0 auto; padding: 18px 16px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; text-decoration: none; }
    .tag { color: var(--muted); font-size: 14px; }
    .notice { max-width: 1120px; margin: 8px auto 0; padding: 0 16px; }
    .notice div { background: #dcfce7; color: #14532d; border-radius: 10px; padding: 12px 14px; font-weight: 600; }
    .notice div.err { background: #fee2e2; color: #7f1d1d; }
    .head { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .head h1 { font-size: 18px; margin: 0; }
    .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
    .chip .t { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
    .grid { max-width: 1120px; margin: 0 auto; padding: 4px 16px 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #fff; }
    .body { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .cat { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
    .name { font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
    .price { font-size: 20px; font-weight: 800; }
    .ship { font-size: 12px; color: var(--muted); }
    .buy { margin-top: auto; display: block; text-align: center; background: var(--buy); color: #fff; text-decoration: none; font-weight: 800; padding: 11px 8px; border-radius: 10px; font-size: 15px; }
    .buy:hover, .buy:focus-visible { background: var(--buy-hover); }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    footer div { max-width: 1120px; margin: 0 auto; padding: 18px 16px 28px; display: flex; flex-wrap: wrap; gap: 8px 18px; }
  </style>
</head>
<body>
  <div class="bar">Free US shipping · Today's deals refresh in <span class="t" data-timer>--:--:--</span></div>

  <header>
    <a class="brand" href="/">Northline Finds</a>
    <span class="tag">Cheap finds. Tap, buy, done.</span>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="head">
    <h1>Today's lineup · cheapest first</h1>
    <span class="chip">New lineup in <span class="t" data-timer>--:--:--</span></span>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>

  <footer>
    <div>
      <span>Secure checkout by Stripe</span>
      <span>Ships in 7–14 business days</span>
      <a href="/shop/refunds.html">30-day returns</a>
      <a href="/shop/shipping.html">Shipping info</a>
      <a href="mailto:roman.proposal@gmail.com">roman.proposal@gmail.com</a>
    </div>
  </footer>

  <script>
    // Fallback list (the original products) so the page still sells if /api/catalog is down.
    var FALLBACK = [{"id":"veggie-chopper-5in1","name":"5-in-1 Vegetable Chopper & Dicer","price":29.99,"category":"Kitchen","image":"/shop/assets/img/veggie-chopper-5in1.svg","buy":"https://buy.stripe.com/7sY28qaBDfZW6ff0Wz6EU04"},{"id":"electric-milk-frother","name":"Handheld Electric Milk Frother","price":19.99,"category":"Kitchen","image":"/shop/assets/img/electric-milk-frother.svg","buy":"https://buy.stripe.com/bJe8wOdNP152avv48L6EU05"},{"id":"silicone-stretch-lids","name":"Reusable Silicone Stretch Lids (6-Pack)","price":19.99,"category":"Kitchen","image":"/shop/assets/img/silicone-stretch-lids.svg","buy":"https://buy.stripe.com/fZueVcfVX296gTT6gT6EU06"},{"id":"oil-sprayer-mister","name":"Refillable Oil Sprayer Mister","price":16.99,"category":"Kitchen","image":"/shop/assets/img/oil-sprayer-mister.svg","buy":"https://buy.stripe.com/28EcN4cJL00Yavv9t56EU07"},{"id":"motion-sensor-led-lights","name":"Motion-Sensor LED Light Strips (USB Rechargeable)","price":24.99,"category":"Home","image":"/shop/assets/img/motion-sensor-led-lights.svg","buy":"https://buy.stripe.com/5kQaEW6ln4he0UVbBd6EU08"},{"id":"filtered-showerhead","name":"High-Pressure Filtered Showerhead","price":34.99,"category":"Home","image":"/shop/assets/img/filtered-showerhead.svg","buy":"https://buy.stripe.com/dRmdR88tv6pm333cFh6EU09"},{"id":"electric-spin-scrubber","name":"Cordless Electric Spin Scrubber","price":29.99,"category":"Home","image":"/shop/assets/img/electric-spin-scrubber.svg","buy":"https://buy.stripe.com/7sY14maBDcNKdHHeNp6EU0a"},{"id":"galaxy-star-projector","name":"Galaxy Star Projector Night Light","price":29.99,"category":"Home","image":"/shop/assets/img/galaxy-star-projector.svg","buy":"https://buy.stripe.com/14AdR8aBDbJG1YZ9t56EU0b"},{"id":"mini-car-vacuum","name":"Cordless Mini Car Vacuum","price":39.99,"category":"Car","image":"/shop/assets/img/mini-car-vacuum.svg","buy":"https://buy.stripe.com/6oU8wO4dfaFC47734H6EU0c"},{"id":"car-trash-can","name":"Car Trash Can with Lid","price":19.99,"category":"Car","image":"/shop/assets/img/car-trash-can.svg","buy":"https://buy.stripe.com/bJefZgfVX5liavv7kX6EU0d"},{"id":"headrest-car-hooks","name":"Backseat Headrest Bag Hooks (2-Pack)","price":14.99,"category":"Car","image":"/shop/assets/img/headrest-car-hooks.svg","buy":"https://buy.stripe.com/7sY7sKdNP3dacDDdJl6EU0e"},{"id":"pet-hair-remover-roller","name":"Reusable Pet Hair Remover Roller","price":17.99,"category":"Pet","image":"/shop/assets/img/pet-hair-remover-roller.svg","buy":"https://buy.stripe.com/bJe9AS39b6pm6ffax96EU0f"},{"id":"dog-lick-mat","name":"Dog Lick Mat Slow Feeder","price":14.99,"category":"Pet","image":"/shop/assets/img/dog-lick-mat.svg","buy":"https://buy.stripe.com/dRm00i4dfeVS6ffgVx6EU0g"},{"id":"cat-window-hammock","name":"Cat Window Hammock Perch","price":29.99,"category":"Pet","image":"/shop/assets/img/cat-window-hammock.svg","buy":"https://buy.stripe.com/14AaEW8tv3da6ff5cP6EU0h"},{"id":"gooseneck-phone-holder","name":"Gooseneck Phone Holder Clamp","price":24.99,"category":"Phone & Gadgets","image":"/shop/assets/img/gooseneck-phone-holder.svg","buy":"https://buy.stripe.com/9B6eVc4dfaFC0UVcFh6EU0i"},{"id":"sunset-projection-lamp","name":"Sunset Projection Lamp","price":22.99,"category":"Phone & Gadgets","image":"/shop/assets/img/sunset-projection-lamp.svg","buy":"https://buy.stripe.com/9B6eVc5hjeVS8nncFh6EU0j"},{"id":"magnetic-cable-clips","name":"Magnetic Cable Organizer Clips (5-Pack)","price":12.99,"category":"Phone & Gadgets","image":"/shop/assets/img/magnetic-cable-clips.svg","buy":"https://buy.stripe.com/eVq00i9xzdRO7jjeNp6EU0k"},{"id":"portable-usb-blender","name":"Portable USB-Rechargeable Blender","price":34.99,"category":"Kitchen","image":"/shop/assets/img/portable-usb-blender.svg","buy":"https://buy.stripe.com/9B63cu1134heeLL6gT6EU0l"}];

    // The lineup is re-scraped daily by a cron at 09:00 UTC (it can fire any time in that hour),
    // so the countdown targets 10:00 UTC, when the new lineup is guaranteed to be in.
    function nextRefresh() {
      var now = new Date();
      var t = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 10, 0, 0);
      if (t <= now.getTime()) t += 86400000;
      return t;
    }
    var target = nextRefresh();
    function tick() {
      var ms = target - Date.now();
      if (ms <= 0) { target = nextRefresh(); ms = target - Date.now(); }
      var s = Math.floor(ms / 1000);
      var txt = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60]
        .map(function (n) { return String(n).padStart(2, "0"); }).join(":");
      document.querySelectorAll("[data-timer]").forEach(function (el) { el.textContent = txt; });
    }
    tick();
    setInterval(tick, 1000);

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function render(products) {
      products = products.slice().sort(function (a, b) { return a.price - b.price; });
      document.getElementById("grid").innerHTML = products.map(function (p) {
        return '<article class="card">' +
          '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy" referrerpolicy="no-referrer">' +
          '<div class="body">' +
            '<span class="cat">' + esc(p.category) + '</span>' +
            '<span class="name">' + esc(p.name) + '</span>' +
            '<span class="price">$' + Number(p.price).toFixed(2) + '</span>' +
            '<span class="ship">Free US shipping</span>' +
            '<a class="buy" href="' + esc(p.buy) + '">Buy now</a>' +
          '</div></article>';
      }).join("");
    }

    render(FALLBACK);
    fetch("/api/catalog")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { if (d.products && d.products.length) render(d.products); })
      .catch(function () {});

    var q = new URLSearchParams(location.search);
    var msg = q.get("order") === "success"
      ? ["", "Order confirmed! Your receipt is on its way to your email."]
      : q.get("checkout") ? ["err", "That item just sold out or changed. Pick another one below."] : null;
    if (msg) {
      var n = document.getElementById("notice");
      n.innerHTML = '<div class="' + msg[0] + '">' + msg[1] + "</div>";
      n.hidden = false;
    }
  </script>
</body>
</html>
